[project]
name = "elman-exercise"
version = "0.1.0"
description = "A benchmark for clinical-trial outcome prediction (Elman technical exercise)"
readme = "README.md"
authors = [
    { email = "j.e.mcgonigle@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
elman-exercise = "elman_exercise:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6.2.0",
]
hierarchical = [
    "jax>=0.12.0.1",
    "numpyro>=0.22.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
